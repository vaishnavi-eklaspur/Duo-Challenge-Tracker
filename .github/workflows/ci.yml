name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Fail only on vulnerabilities that ship to users; dev-only toolchain
      # advisories (esbuild/vite dev server) are tracked in SECURITY_AUDIT.md.
      - run: npm audit --omit=dev --audit-level=high
